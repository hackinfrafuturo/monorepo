version: 0.2
phases:
  pre_build:
    commands:
      - 'test "$IMAGE_TAG" != SET_AT_BUILD_START'
      - 'echo "$IMAGE_TAG" | grep -Eq "^[a-f0-9]{64}$"'
      - 'aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URI%%/*}"'
  build:
    commands:
      - 'docker build --platform linux/amd64 -f intranet/infra/aws/Dockerfile -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" .'
  post_build:
    commands:
      - 'test "$CODEBUILD_BUILD_SUCCEEDING" = 1'
      - 'docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"'
      - 'aws ecr describe-images --repository-name "${ECR_REPOSITORY_URI#*/}" --image-ids imageTag="$IMAGE_TAG" --query "imageDetails[0].imageDigest" --output text'
